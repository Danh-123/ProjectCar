<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đăng nhập / Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body class="auth-body">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card auth-card shadow-lg border-0">
          <div class="card-header bg-transparent border-0 pt-4">
            <ul class="nav nav-pills justify-content-center gap-2" id="authTabs">
              <li class="nav-item">
                <button class="nav-link active" data-tab="login" id="loginTabBtn" type="button">Đăng nhập</button>
              </li>
              <li class="nav-item">
                <button class="nav-link" data-tab="register" id="registerTabBtn" type="button">Đăng ký</button>
              </li>
            </ul>
          </div>
          <div class="card-body p-4">
            <div id="authAlert" class="alert d-none" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate class="needs-validation">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="nhap@email.com" autocomplete="email" required />
                <div class="invalid-feedback">Vui lòng nhập email hợp lệ.</div>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Mật khẩu" autocomplete="current-password" required />
                <div class="invalid-feedback">Vui lòng nhập mật khẩu.</div>
              </div>
              <button id="loginBtn" type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" novalidate class="needs-validation d-none">
              <div class="mb-3">
                <label for="regName" class="form-label">Họ tên</label>
                <input type="text" class="form-control" id="regName" placeholder="Nguyễn Văn A" autocomplete="name" required />
                <div class="invalid-feedback">Vui lòng nhập họ tên.</div>
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="regEmail" placeholder="nhap@email.com" autocomplete="email" required />
                <div class="invalid-feedback">Email không hợp lệ.</div>
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Ít nhất 8 ký tự, 1 chữ hoa, 1 số" autocomplete="new-password" required />
                <div class="invalid-feedback">Mật khẩu chưa đạt yêu cầu.</div>
                <div class="form-text">Ít nhất 8 ký tự, có 1 chữ hoa và 1 số.</div>
              </div>
              <div class="mb-3">
                <label for="regConfirm" class="form-label">Xác nhận mật khẩu</label>
                <input type="password" class="form-control" id="regConfirm" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required />
                <div class="invalid-feedback">Mật khẩu xác nhận không khớp.</div>
              </div>
              <button id="registerBtn" type="submit" class="btn btn-success w-100">Đăng ký</button>
            </form>
          </div>
          <div class="card-footer text-center small bg-transparent border-0 pb-4">
            <span>Đã có tài khoản? </span>
            <a href="#" id="switchToLogin">Chuyển sang đăng nhập</a>
          </div>
        </div>
        <p class="text-center text-muted mt-3">© 2025 Auth Frontend</p>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
