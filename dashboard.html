<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body class="dashboard-body">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Bảng điều khiển</span>
      <button id="logoutBtn" class="btn btn-outline-light">Đăng xuất</button>
    </div>
  </nav>

  <main class="container py-5">
    <div id="profileCard" class="card shadow border-0">
      <div class="card-body p-4">
        <h3 class="card-title mb-3">Xin chào, <span id="userName">...</span></h3>
        <p class="mb-1">Email: <strong id="userEmail">...</strong></p>
      </div>
    </div>

    <div id="dashAlert" class="alert d-none mt-3" role="alert"></div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
